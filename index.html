<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>交易對配對工具</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body{padding:20px}
    .result-area{font-family:monospace;font-size:14px;white-space:pre-wrap}
    .form-section{margin-bottom:20px;padding:15px;border:1px solid #dee2e6;border-radius:5px}
    .loading{display:none;color:#007bff}
    .custom-pairing-options{margin-top:15px;padding:10px;background:#f8f9fa;border-radius:5px}
    .option-description{font-size:12px;color:#6c757d;margin-left:20px}
  </style>
</head>
<body>
<div class="container">
  <h2 class="mb-4">交易對配對工具</h2>

  <!--───────── 標準配對 ─────────-->
  <div class="form-section">
    <h4>標準配對功能</h4>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="leftInput">配對標的組 (左)</label>
          <textarea class="form-control" id="leftInput" rows="5" placeholder="請輸入標的，用逗號或換行分隔"></textarea>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="rightInput">配對標的組 (右)</label>
          <textarea class="form-control" id="rightInput" rows="5" placeholder="請輸入標的，用逗號或換行分隔"></textarea>
        </div>
      </div>
    </div>
    <div class="row mb-3 align-items-center">
      <div class="col-auto">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="addMajorCoins">
          <label class="form-check-label" for="addMajorCoins">加入大幣配對</label>
        </div>
      </div>
      <div class="col-auto">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="priceSort" checked>
          <label class="form-check-label" for="priceSort">配對依照市價高低組合</label>
        </div>
        <div class="loading" id="priceLoading" style="margin-left:25px">正在取得市價資料...</div>
      </div>
    </div>
    <div class="mb-3">
      <button type="button" class="btn btn-primary mr-2" onclick="generateFullPairs()">產生完整配對</button>
      <button type="button" class="btn btn-success mr-2" onclick="generateUniquePairs()">產生不重複配對</button>
      <button type="button" class="btn btn-info mr-2" onclick="generateOneWayPairs()">單向配對</button>
    </div>
  </div>

  <!--───────── RS + 自訂配對 ─────────-->
  <div class="form-section">
    <h4>RS 清單建立強弱組合</h4>
    <div class="row">
      <div class="col-md-2">
        <div class="form-group">
          <label for="strongCount">強勢組數</label>
          <input type="number" class="form-control" id="strongCount" value="10" min="0">
        </div>
      </div>
      <div class="col-md-2">
        <div class="form-group">
          <label for="weakCount">弱勢組數</label>
          <input type="number" class="form-control" id="weakCount" value="10" min="0">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label for="rsFile">上傳 RS 清單 (.txt)</label>
          <input type="file" class="form-control-file" id="rsFile" accept=".txt">
        </div>
      </div>
      <div class="col-md-4 mt-4 pt-2">
        <button type="button" class="btn btn-secondary" id="autoFetchRsBtn">自動讀取最新 RS 清單</button>
        <span class="loading" id="autoFetchLoading">讀取中...</span>
      </div>
    </div>

    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="enableCustomPairing">
      <label class="form-check-label" for="enableCustomPairing"><strong>加入自訂標的配對</strong></label>
    </div>

    <div class="custom-pairing-options" id="customPairingOptions" style="display:none">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="customAsStrong">
        <label class="form-check-label" for="customAsStrong">選項A：自訂標的作為強勢組</label>
        <div class="option-description">自訂標的 vs RS弱勢組</div>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="customAsWeak">
        <label class="form-check-label" for="customAsWeak">選項B：自訂標的作為弱勢組</label>
        <div class="option-description">RS強勢組 vs 自訂標的</div>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="customAsBoth" checked>
        <label class="form-check-label" for="customAsBoth">選項C：自訂標的同時作為強勢和弱勢 <span class="badge badge-primary">預設</span></label>
        <div class="option-description">自訂標的 vs RS弱勢組，且 RS強勢組 vs 自訂標的</div>
      </div>
      <small class="text-muted"><strong>說明：</strong>多選時會額外加入以上配對，並自動加區塊標籤</small>
    </div>

    <button type="button" class="btn btn-warning mt-2" onclick="generateRSPairs()">使用 RS 清單建立強弱組合</button>
  </div>

  <!--───────── 生成結果 ─────────-->
  <div class="mb-3">
    <button type="button" class="btn btn-secondary" onclick="downloadResult()">下載結果</button>
    <button id="uploadToTradingView" style="display:none;margin-left:8px" class="btn btn-success" onclick="uploadToTradingView()">匯入 TradingView</button>
  </div>
  <div class="form-group">
    <label for="result">生成結果</label>
    <textarea id="result" class="form-control result-area" rows="15" readonly></textarea>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
let resultText = '', latestRsContent = '';
const majorCoins = ['BTC','ETH','ETC','ATOM','POL','ADA','AVAX','DOT','BNB','SOL','XRP','LTC','DOGE'];
const driveFileId = '1QOqbo5CMv-1Danv-iJk8fsen_QnCXN6v';
const apiKey     = 'AIzaSyBFLHlDiNbiTEYtnoqx_-bj4D2ePGHeHnw';

document.getElementById('addMajorCoins').addEventListener('change',e=>{
  if(e.target.checked) document.getElementById('leftInput').value = majorCoins.join('\n');
});
document.getElementById('enableCustomPairing').addEventListener('change',e=>{
  document.getElementById('customPairingOptions').style.display = e.target.checked ? 'block' : 'none';
});

function fmt(s){
  s = s.trim().toUpperCase().replace('USDC.P','USDT.P');
  return /^BINANCE:/.test(s) ? s : `BINANCE:${s}USDT.P`;
}
const split = str => str.split(/[\s,]+/).filter(Boolean);

async function priceMap(symbols){
  const list = symbols.map(s=>s.replace('BINANCE:','').replace('.P',''));
  const res  = await fetch('https://fapi.binance.com/fapi/v1/ticker/price').then(r=>r.json());
  const map  = {};
  res.forEach(i=>{ if(list.includes(i.symbol)) map[i.symbol]=+i.price; });
  return map;
}
async function sortByPrice(arr){
  if(!document.getElementById('priceSort').checked) return arr;
  document.getElementById('priceLoading').style.display='block';
  try{
    const set=new Set();
    arr.forEach(p=>{ if(p.includes('/')){const [l,r]=p.split('/');set.add(l);set.add(r);} });
    const pm=await priceMap([...set]);
    return arr.map(p=>{
      if(!p.includes('/')) return p;
      const [l,r]=p.split('/'),
            lp=pm[l.replace('BINANCE:','').replace('.P','')]||0,
            rp=pm[r.replace('BINANCE:','').replace('.P','')]||0;
      return lp>=rp?`${l}/${r}`:`${r}/${l}`;
    });
  }finally{
    document.getElementById('priceLoading').style.display='none';
  }
}

async function generateFullPairs(){
  const left=split(document.getElementById('leftInput').value),
        right=split(document.getElementById('rightInput').value),
        all=[...new Set([...left,...right])],
        pairs=[];
  for(let i=0;i<all.length;i++)for(let j=0;j<all.length;j++)if(i!==j)pairs.push(`${fmt(all[i])}/${fmt(all[j])}`);
  resultText=(await sortByPrice(pairs)).join(',\n');
  document.getElementById('result').value=resultText;
  document.getElementById('uploadToTradingView').style.display='inline-block';
}
async function generateUniquePairs(){
  const left=split(document.getElementById('leftInput').value),
        right=split(document.getElementById('rightInput').value),
        all=[...new Set([...left,...right])],
        pairs=[];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)pairs.push(`${fmt(all[i])}/${fmt(all[j])}`);
  resultText=(await sortByPrice(pairs)).join(',\n');
  document.getElementById('result').value=resultText;
  document.getElementById('uploadToTradingView').style.display='inline-block';
}
async function generateOneWayPairs(){
  const left=split(document.getElementById('leftInput').value),
        right=split(document.getElementById('rightInput').value),
        pairs=[];
  left.forEach(l=>right.forEach(r=>{const lf=fmt(l),rf=fmt(r);if(lf!==rf)pairs.push(`${lf}/${rf}`);}));
  resultText=(await sortByPrice(pairs)).join(',\n');
  document.getElementById('result').value=resultText;
  document.getElementById('uploadToTradingView').style.display='inline-block';
}

async function generateRSPairs(){
  let txt='';
  const file=document.getElementById('rsFile');
  if(file.files.length>0)      txt=await file.files[0].text();
  else if(latestRsContent)     txt=latestRsContent;
  else { alert('請先上傳 RS 清單或使用自動讀取！'); return; }

  const strongCnt=parseInt(document.getElementById('strongCount').value)||0,
        weakCnt  =parseInt(document.getElementById('weakCount').value)||0,
        lines    =txt.split('\n').map(l=>l.trim()).filter(l=>l && !l.includes('BINANCE:BTCDOMUSDT.P')),
        hasCus   =document.getElementById('enableCustomPairing').checked;

  if(!hasCus && (strongCnt===0 || weakCnt===0)){ alert('錯誤：使用純 RS 清單時，強弱組數都必須大於 0'); return; }
  if( hasCus && (strongCnt===0 && weakCnt===0)){ alert('錯誤：強弱組數不可同時為 0'); return; }

  const strong=strongCnt?lines.slice(0,strongCnt).map(fmt):[],
        weak  =weakCnt? lines.slice(-weakCnt).map(fmt):[],
        block={A:[],B:[],C:[]};

  if(strong.length&&weak.length)strong.forEach(s=>weak.forEach(w=>{if(s!==w)block.A.push(`${s}/${w}`);})); 

  if(hasCus){
    const cus=[...new Set(split(document.getElementById('leftInput').value).map(fmt))];
    if(document.getElementById('customAsStrong').checked&&weak.length)
      cus.forEach(c=>weak.forEach(w=>{if(c!==w)block.B.push(`${c}/${w}`);})); 
    if(document.getElementById('customAsWeak').checked&&strong.length)
      strong.forEach(s=>cus.forEach(c=>{if(s!==c)block.C.push(`${s}/${c}`);})); 
    if(document.getElementById('customAsBoth').checked){
      if(weak.length)  cus.forEach(c=>weak.forEach(w=>{if(c!==w)block.B.push(`${c}/${w}`);})); 
      if(strong.length)strong.forEach(s=>cus.forEach(c=>{if(s!==c)block.C.push(`${s}/${c}`);})); 
    }
  }
  let out=[];
  if(block.A.length)out.push('###RS強勢對弱勢',...block.A);
  if(block.B.length)out.push('###自訂對弱勢',...block.B);
  if(block.C.length)out.push('###自訂對強勢',...block.C);

  resultText=(await sortByPrice(out)).join(',\n');
  document.getElementById('result').value=resultText;
  document.getElementById('uploadToTradingView').style.display='inline-block';
}

document.getElementById('autoFetchRsBtn').addEventListener('click',async()=>{
  const load=document.getElementById('autoFetchLoading');
  load.style.display='inline';
  try{
    const url=`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media&key=${apiKey}`;
    const rsp=await fetch(url);
    if(!rsp.ok)throw new Error('HTTP '+rsp.status);
    latestRsContent=await rsp.text();
    resultText=latestRsContent;
    document.getElementById('result').value=resultText;
    document.getElementById('uploadToTradingView').style.display='inline-block';
    alert('✅ 讀取成功！');
  }catch(e){ alert('❌ 讀取失敗: '+e.message); }
  finally{ load.style.display='none'; }
});

function downloadResult(){
  if(!resultText){ alert('請先產生配對再下載！'); return; }
  const d=new Date(),
        ts=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2);
  const blob=new Blob([resultText],{type:'text/plain'}),
        link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download=`LS_Pairs_${ts}.txt`;
  link.click();
  URL.revokeObjectURL(link.href);
}

function inTG(){ return window.Telegram && Telegram.WebApp; }

function uploadToTradingView(){
  const txt=document.getElementById('result').value.trim();
  if(!txt){ alert('請先產生或貼上配對結果'); return; }

  if(inTG()){
    const d=new Date(),
          name=`Pairs_${d.getFullYear()}${('0'+(d.getMonth()+1)).slice(-2)}${('0'+d.getDate()).slice(-2)}_${('0'+d.getHours()).slice(-2)}${('0'+d.getMinutes()).slice(-2)}`;
    Telegram.WebApp.sendData(JSON.stringify({action:'upload_to_tradingview',symbols:txt,listName:name}));
  }else{
    try{
      localStorage.setItem('tv-chart-temporary-clipboard',txt);
    }catch(e){}
    window.open('https://www.tradingview.com/chart/','_blank');
  }
}
</script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  if(inTG()){ Telegram.WebApp.ready(); document.getElementById('uploadToTradingView').style.display='inline-block'; }
});
</script>
</body>
</html>
