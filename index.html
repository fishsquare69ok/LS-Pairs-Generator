<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>交易對配對工具</title>
    <link
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <style>
        body {
            padding: 20px;
        }
        .result-area {
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .form-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .loading {
            display: none;
            color: #007bff;
        }
        .custom-pairing-options {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .option-description {
            font-size: 12px;
            color: #6c757d;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">交易對配對工具</h2>
        
        <!-- 標準配對功能區 -->
        <div class="form-section">
            <h4>標準配對功能</h4>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="leftInput">配對標的組 (左)</label>
                        <textarea
                            class="form-control"
                            id="leftInput"
                            rows="5"
                            placeholder="請輸入標的，用逗號或換行分隔"
                        ></textarea>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="rightInput">配對標的組 (右)</label>
                        <textarea
                            class="form-control"
                            id="rightInput"
                            rows="5"
                            placeholder="請輸入標的，用逗號或換行分隔"
                        ></textarea>
                    </div>
                </div>
            </div>
            
            <!-- 勾選框並排 -->
            <div class="row mb-3 align-items-center">
                <div class="col-auto">
                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="addMajorCoins"
                        />
                        <label class="form-check-label" for="addMajorCoins"
                            >加入大幣配對</label
                        >
                    </div>
                </div>
                <div class="col-auto">
                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="priceSort"
                            checked
                        />
                        <label class="form-check-label" for="priceSort"
                            >配對依照市價高低組合</label
                        >
                    </div>
                    <div
                        class="loading"
                        id="priceLoading"
                        style="margin-left: 25px"
                    >
                        正在取得市價資料...
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <button
                    type="button"
                    class="btn btn-primary mr-2"
                    onclick="generateFullPairs()"
                >
                    產生完整配對
                </button>
                <button
                    type="button"
                    class="btn btn-success mr-2"
                    onclick="generateUniquePairs()"
                >
                    產生不重複配對
                </button>
                <button
                    type="button"
                    class="btn btn-info mr-2"
                    onclick="generateOneWayPairs()"
                >
                    單向配對
                </button>
            </div>
        </div>

        <!-- RS 清單強弱組合 + 自訂配對 -->
        <div class="form-section">
            <h4>RS 清單建立強弱組合</h4>
            <div class="row">
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="strongCount">強勢組數</label>
                        <input
                            type="number"
                            class="form-control"
                            id="strongCount"
                            value="10"
                            min="0"
                        />
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="weakCount">弱勢組數</label>
                        <input
                            type="number"
                            class="form-control"
                            id="weakCount"
                            value="10"
                            min="0"
                        />
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="rsFile">上傳 RS 清單 (.txt)</label>
                        <input
                            type="file"
                            class="form-control-file"
                            id="rsFile"
                            accept=".txt"
                        />
                    </div>
                </div>
                <div class="col-md-4 mt-4 pt-2">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="autoFetchRsBtn"
                    >
                        自動讀取最新 RS 清單
                    </button>
                    <span
                        class="loading"
                        id="autoFetchLoading"
                        style="display:none;"
                    >
                        讀取中...
                    </span>
                </div>
            </div>

            <div class="form-check mb-2">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="enableCustomPairing"
                />
                <label
                    class="form-check-label"
                    for="enableCustomPairing"
                    ><strong>加入自訂標的配對</strong></label
                >
            </div>

            <div
                class="custom-pairing-options"
                id="customPairingOptions"
                style="display: none"
            >
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="customAsStrong"
                    />
                    <label class="form-check-label" for="customAsStrong">
                        選項A：自訂標的作為強勢組
                    </label>
                    <div class="option-description">
                        自訂標的 vs RS弱勢組
                    </div>
                </div>
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="customAsWeak"
                    />
                    <label class="form-check-label" for="customAsWeak">
                        選項B：自訂標的作為弱勢組
                    </label>
                    <div class="option-description">
                        RS強勢組 vs 自訂標的
                    </div>
                </div>
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="customAsBoth"
                        checked
                    />
                    <label class="form-check-label" for="customAsBoth">
                        選項C：自訂標的同時作為強勢和弱勢
                        <span class="badge badge-primary">預設</span>
                    </label>
                    <div class="option-description">
                        自訂標的 vs RS弱勢組，且 RS強勢組 vs 自訂標的
                    </div>
                </div>
                <small class="text-muted"
                    ><strong>說明：</strong>多選時會額外加入以上分別配對，
                    並會輸出時標示區塊標籤
                </small>
            </div>

            <button
                type="button"
                class="btn btn-warning mt-2"
                onclick="generateRSPairs()"
            >
                使用 RS 清單建立強弱組合
            </button>
        </div>

        <div class="mb-3">
            <button
                type="button"
                class="btn btn-secondary"
                onclick="downloadResult()"
            >
                下載結果
            </button>
        </div>

        <div class="form-group">
            <label for="result">生成結果</label>
            <textarea
                class="form-control result-area"
                id="result"
                rows="15"
                readonly
            ></textarea>
        </div>
    </div>

    <script>
        let result = '';
        let latestRsContent = '';  // 儲存最新讀取的RS清單內容

        // 大幣清單
        const majorCoins = [
            'BTC', 'ETH', 'ETC', 'ATOM', 'POL', 'ADA', 'AVAX', 'DOT', 'BNB', 'SOL', 'XRP', 'LTC', 'DOGE'
        ];
        
        // 勾選大幣時，直接覆蓋左側欄位
        document.getElementById('addMajorCoins').addEventListener('change', function () {
            if (this.checked) {
                document.getElementById('leftInput').value = majorCoins.join('\n');
            }
        });

        // 控制自訂配對選項顯示隱藏
        document.getElementById('enableCustomPairing').addEventListener('change', function () {
            const options = document.getElementById('customPairingOptions');
            options.style.display = this.checked ? 'block' : 'none';
        });

        function handleSymbolFormat(symbol) {
            symbol = symbol.trim().toUpperCase();
            symbol = symbol.replace('USDC.P', 'USDT.P');
            if (!/^BINANCE:/.test(symbol)) {
                symbol = `BINANCE:${symbol}USDT.P`;
            }
            return symbol;
        }

        function splitInput(input) {
            return input.split(/[\s,]+/).filter((item) => item.trim() !== '');
        }

        // 取得幣安期貨價格
        async function getBinancePrices(symbols) {
            const apiSymbols = symbols.map((s) => s.replace('BINANCE:', '').replace('.P', ''));
            try {
                const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/price');
                const data = await response.json();
                const prices = {};
                data.forEach((item) => {
                    if (apiSymbols.includes(item.symbol)) {
                        prices[item.symbol] = parseFloat(item.price);
                    }
                });
                return prices;
            } catch (error) {
                console.error('取得價格失敗:', error);
                return {};
            }
        }

        async function sortPairsByPrice(pairs) {
            if (!document.getElementById('priceSort').checked) {
                return pairs;
            }
            document.getElementById('priceLoading').style.display = 'block';
            try {
                const allSymbols = new Set();
                pairs.forEach((pair) => {
                    if (pair.includes('/')) {
                        const [left, right] = pair.split('/');
                        allSymbols.add(left);
                        allSymbols.add(right);
                    }
                });
                const prices = await getBinancePrices(Array.from(allSymbols));
                return pairs.map((pair) => {
                    if (!pair.includes('/')) return pair; // 保持標籤不變
                    const [left, right] = pair.split('/');
                    const leftSymbol = left.replace('BINANCE:', '').replace('.P', '');
                    const rightSymbol = right.replace('BINANCE:', '').replace('.P', '');
                    const leftPrice = prices[leftSymbol] || 0;
                    const rightPrice = prices[rightSymbol] || 0;
                    if (leftPrice >= rightPrice) {
                        return `${left}/${right}`;
                    } else {
                        return `${right}/${left}`;
                    }
                });
            } catch (error) {
                console.error('價格排序失敗:', error);
                return pairs;
            } finally {
                document.getElementById('priceLoading').style.display = 'none';
            }
        }

        async function generateFullPairs() {
            const leftInput = document.getElementById('leftInput').value;
            const rightInput = document.getElementById('rightInput').value;
            const leftSymbols = splitInput(leftInput);
            const rightSymbols = splitInput(rightInput);
            const allSymbols = [...new Set([...leftSymbols, ...rightSymbols])];
            let pairs = [];
            for (let i = 0; i < allSymbols.length; i++) {
                for (let j = 0; j < allSymbols.length; j++) {
                    if (i !== j) {
                        const symbol1 = handleSymbolFormat(allSymbols[i]);
                        const symbol2 = handleSymbolFormat(allSymbols[j]);
                        pairs.push(`${symbol1}/${symbol2}`);
                    }
                }
            }
            result = pairs.join(',\n');
            document.getElementById('result').value = result;
        }

        async function generateUniquePairs() {
            const leftInput = document.getElementById('leftInput').value;
            const rightInput = document.getElementById('rightInput').value;
            const leftSymbols = splitInput(leftInput);
            const rightSymbols = splitInput(rightInput);
            const allSymbols = [...new Set([...leftSymbols, ...rightSymbols])];
            let pairs = [];
            for (let i = 0; i < allSymbols.length; i++) {
                for (let j = i + 1; j < allSymbols.length; j++) {
                    const symbol1 = handleSymbolFormat(allSymbols[i]);
                    const symbol2 = handleSymbolFormat(allSymbols[j]);
                    pairs.push(`${symbol1}/${symbol2}`);
                }
            }
            const sortedPairs = await sortPairsByPrice(pairs);
            result = sortedPairs.join(',\n');
            document.getElementById('result').value = result;
        }

        async function generateOneWayPairs() {
            const leftInput = document.getElementById('leftInput').value;
            const rightInput = document.getElementById('rightInput').value;
            const leftSymbols = splitInput(leftInput);
            const rightSymbols = splitInput(rightInput);
            let pairs = [];
            leftSymbols.forEach((left) => {
                rightSymbols.forEach((right) => {
                    const leftFormatted = handleSymbolFormat(left);
                    const rightFormatted = handleSymbolFormat(right);
                    if (leftFormatted !== rightFormatted) {
                        pairs.push(`${leftFormatted}/${rightFormatted}`);
                    }
                });
            });
            const sortedPairs = await sortPairsByPrice(pairs);
            result = sortedPairs.join(',\n');
            document.getElementById('result').value = result;
        }

        async function generateRSPairs() {
            let text = '';
            
            // 檢查是否有上傳檔案或已讀取的內容
            const fileInput = document.getElementById('rsFile');
            if (fileInput.files.length > 0) {
                text = await fileInput.files[0].text();
            } else if (latestRsContent) {
                text = latestRsContent;
            } else {
                alert('請先上傳 RS 清單文件或使用自動讀取功能');
                return;
            }

            const strongCount = parseInt(document.getElementById('strongCount').value) || 0;
            const weakCount = parseInt(document.getElementById('weakCount').value) || 0;

            const lines = text
                .split('\n')
                .map((line) => line.trim())
                .filter((line) => line && !line.includes('BINANCE:BTCDOMUSDT.P'));

            // 判斷條件
            const rsOnly = !document.getElementById('enableCustomPairing').checked;
            if (rsOnly && (strongCount === 0 || weakCount === 0)) {
                alert('RS 清單建立強弱組合時，強勢組數和弱勢組數都必須大於 0');
                return;
            }

            // 0組用10補充（除非rsOnly且數為0會停止）
            const useStrongCount = strongCount > 0 ? strongCount : (rsOnly ? 0 : 10);
            const useWeakCount = weakCount > 0 ? weakCount : (rsOnly ? 0 : 10);

            const strongSymbols = lines.slice(0, useStrongCount).map(handleSymbolFormat);
            const weakSymbols = lines.slice(-useWeakCount).map(handleSymbolFormat);

            let pairs = [];
            const blocks = { blockA: [], blockB: [], blockC: [] };

            // 區塊 A (RS強 vs 弱)
            if (useStrongCount > 0 && useWeakCount > 0) {
                strongSymbols.forEach((strong) => {
                    weakSymbols.forEach((weak) => {
                        if (strong !== weak) blocks.blockA.push(`${strong}/${weak}`);
                    });
                });
            }

            if (document.getElementById('enableCustomPairing').checked) {
                const leftInput = document.getElementById('leftInput').value;
                const customSymbols = [
                    ...new Set(splitInput(leftInput).map(handleSymbolFormat)),
                ];

                // 區塊 B (自訂 vs 弱)
                if (document.getElementById('customAsStrong').checked) {
                    customSymbols.forEach((custom) => {
                        weakSymbols.forEach((weak) => {
                            if (custom !== weak) blocks.blockB.push(`${custom}/${weak}`);
                        });
                    });
                }

                // 區塊 C (強 vs 自訂)
                if (document.getElementById('customAsWeak').checked) {
                    strongSymbols.forEach((strong) => {
                        customSymbols.forEach((custom) => {
                            if (strong !== custom) blocks.blockC.push(`${strong}/${custom}`);
                        });
                    });
                }

                // 選項C （兩邊都）
                if (document.getElementById('customAsBoth').checked) {
                    customSymbols.forEach((custom) => {
                        weakSymbols.forEach((weak) => {
                            if (custom !== weak) blocks.blockB.push(`${custom}/${weak}`);
                        });
                    });
                    strongSymbols.forEach((strong) => {
                        customSymbols.forEach((custom) => {
                            if (strong !== custom) blocks.blockC.push(`${strong}/${custom}`);
                        });
                    });
                }
            }

            // 組合輸出字串，區塊標籤+配對
            let outputLines = [];

            if (blocks.blockA.length > 0) {
                outputLines.push('###RS強勢對弱勢');
                outputLines = outputLines.concat(blocks.blockA);
            }
            if (blocks.blockB.length > 0) {
                outputLines.push('###自訂對弱勢');
                outputLines = outputLines.concat(blocks.blockB);
            }
            if (blocks.blockC.length > 0) {
                outputLines.push('###自訂對強勢');
                outputLines = outputLines.concat(blocks.blockC);
            }

            const sortedPairs = await sortPairsByPrice(outputLines);
            result = sortedPairs.join(',\n');
            document.getElementById('result').value = result;
        }

        // 自動讀取最新 RS 清單（從 Google Drive 公開連結）
        document.getElementById('autoFetchRsBtn').addEventListener('click', async () => {
            const loadingIcon = document.getElementById('autoFetchLoading');
            loadingIcon.style.display = 'inline';

            try {
                // 這裡需要您提供實際的 Google Drive 檔案公開下載連結
                // 格式通常是：https://drive.google.com/uc?id=檔案ID&export=download
                // 由於檔案會動態更新，您可能需要：
                // 1. 設定固定的檔案名稱覆蓋上傳
                // 2. 或建立一個 API 來取得最新檔案的連結
                
                // 暫時用提示替代，實際部署時請替換成真實連結
                const fileUrl = 'https://drive.google.com/uc?id=1QOqbo5CMv-1Danv-iJk8fsen_QnCXN6v&export=download';
                
                const res = await fetch(fileUrl);
                if (res.ok) {
                    const txtContent = await res.text();
                    latestRsContent = txtContent;
                    document.getElementById('result').value = txtContent;
                    alert('✅ 成功讀取最新 RS 清單！內容已載入到結果區。');
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }
            } catch (e) {
                alert('❌ 讀取失敗: ' + e.message + '\n\n請確認 Google Drive 檔案連結是否正確且為公開狀態。');
                console.error('讀取RS清單失敗:', e);
            } finally {
                loadingIcon.style.display = 'none';
            }
        });

        function downloadResult() {
            if (!result) {
                alert('請先產生配對再下載');
                return;
            }
            const now = new Date();
            const timestamp =
                now.getFullYear().toString() +
                (now.getMonth() + 1).toString().padStart(2, '0') +
                now.getDate().toString().padStart(2, '0') +
                now.getHours().toString().padStart(2, '0') +
                now.getMinutes().toString().padStart(2, '0');
            const a = document.createElement('a');
            const blob = new Blob([result], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = `LS_Pairs_${timestamp}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
