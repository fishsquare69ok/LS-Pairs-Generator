<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>交易對配對工具</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body{padding:20px}
    .result-area{font-family:monospace;font-size:14px;white-space:pre-wrap}
    .form-section{margin-bottom:20px;padding:15px;border:1px solid #dee2e6;border-radius:5px}
    .loading{display:none;color:#007bff}
    .custom-pairing-options{margin-top:15px;padding:10px;background:#f8f9fa;border-radius:5px}
    .option-description{font-size:12px;color:#6c757d;margin-left:20px}
  </style>
</head>
<body>
<div class="container">
  <h2 class="mb-4">交易對配對工具<small style="font-size:60%; color:#666; margin-left:8px;">(v20250817-2248)</small></h2>
  <!--───────── 標準配對 ─────────-->
  <div class="form-section">
    <h4>標準配對功能</h4>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="leftInput">配對標的組 (左)</label>
          <textarea id="leftInput" class="form-control" rows="5" placeholder="請輸入標的，用逗號或換行分隔"></textarea>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="rightInput">配對標的組 (右)</label>
          <textarea id="rightInput" class="form-control" rows="5" placeholder="請輸入標的，用逗號或換行分隔"></textarea>
        </div>
      </div>
    </div>
    <div class="row mb-3 align-items-center">
      <div class="col-auto">
        <div class="form-check">
          <input type="checkbox" id="addMajorCoins" class="form-check-input">
          <label class="form-check-label" for="addMajorCoins">加入大幣配對</label>
        </div>
      </div>
      <div class="col-auto">
        <div class="form-check">
          <input type="checkbox" id="priceSort" class="form-check-input" checked>
          <label class="form-check-label" for="priceSort">配對依照市價高低組合</label>
        </div>
        <span id="priceLoading" class="loading ml-3">正在取得市價資料...</span>
      </div>
    </div>
    <button class="btn btn-primary mr-2" onclick="generateFullPairs()">產生完整配對</button>
    <button class="btn btn-success mr-2" onclick="generateUniquePairs()">產生不重複配對</button>
    <button class="btn btn-info" onclick="generateOneWayPairs()">單向配對</button>
  </div>
  <!--───────── RS + 自訂配對 ─────────-->
  <div class="form-section">
    <h4>RS 清單建立強弱組合</h4>
    <div class="row">
      <div class="col-md-2">
        <label for="strongCount">強勢組數</label>
        <input id="strongCount" type="number" class="form-control" value="10" min="0">
      </div>
      <div class="col-md-2">
        <label for="weakCount">弱勢組數</label>
        <input id="weakCount" type="number" class="form-control" value="10" min="0">
      </div>
      <div class="col-md-4">
        <label for="rsFile">上傳 RS 清單 (.txt)</label>
        <input id="rsFile" type="file" class="form-control-file" accept=".txt">
      </div>
      <div class="col-md-4 mt-4 pt-2">
        <button class="btn btn-secondary" id="autoFetchRsBtn">自動讀取最新 RS 清單</button>
        <span id="autoFetchLoading" class="loading">讀取中...</span>
      </div>
    </div>
    <div class="form-check mb-2">
      <input type="checkbox" id="enableCustomPairing" class="form-check-input">
      <label class="form-check-label" for="enableCustomPairing"><strong>加入自訂標的配對</strong></label>
    </div>
    <div id="customPairingOptions" class="custom-pairing-options" style="display:none">
      <div class="form-check">
        <input type="checkbox" id="customAsStrong" class="form-check-input">
        <label class="form-check-label" for="customAsStrong">選項A：自訂標的作為強勢組</label>
        <div class="option-description">自訂標的 vs RS弱勢組</div>
      </div>
      <div class="form-check">
        <input type="checkbox" id="customAsWeak" class="form-check-input">
        <label class="form-check-label" for="customAsWeak">選項B：自訂標的作為弱勢組</label>
        <div class="option-description">RS強勢組 vs 自訂標的</div>
      </div>
      <div class="form-check">
        <input type="checkbox" id="customAsBoth" class="form-check-input" checked>
        <label class="form-check-label" for="customAsBoth">選項C：自訂標的同時作為強勢和弱勢<span class="badge badge-primary ml-1">預設</span></label>
        <div class="option-description">自訂標的 vs RS弱勢組，且 RS強勢組 vs 自訂標的</div>
      </div>
    </div>
    <button class="btn btn-warning mt-2" onclick="generateRSPairs()">使用 RS 清單建立強弱組合</button>
  </div>
  <!--───────── 生成結果 ─────────-->
  <button class="btn btn-secondary mr-2" onclick="downloadResult()">下載結果</button>
  <button id="uploadToTradingView" class="btn btn-success" style="display:none" onclick="uploadToTradingView()">匯入 TradingView</button>
  <span id="importLimitNote" style="color:#dc3545;display:inline-block;margin-left:10px;font-size:13px;">
    注意：「內容超過4000字」會被拒絕傳送，請簡化清單或下載txt傳Bot。
  </span>
  <div class="form-group mt-3">
    <label for="result">生成結果</label>
    <textarea id="result" class="form-control result-area" rows="15" readonly></textarea>
  </div>
</div>
<!--───────────── 主功能 JavaScript ─────────────-->
<script>
// 先抓常用 DOM 物件
var resultArea        = document.getElementById('result');
var leftInput         = document.getElementById('leftInput');
var rightInput        = document.getElementById('rightInput');
var autoFetchRsBtn    = document.getElementById('autoFetchRsBtn');
var autoFetchLoading  = document.getElementById('autoFetchLoading');
var strongCount       = document.getElementById('strongCount');
var weakCount         = document.getElementById('weakCount');
var rsFile            = document.getElementById('rsFile');
var enableCustomPairing = document.getElementById('enableCustomPairing');
var customAsStrong    = document.getElementById('customAsStrong');
var customAsWeak      = document.getElementById('customAsWeak');
var customAsBoth      = document.getElementById('customAsBoth');

let result = '', latestRsContent = '';
const majorCoins = ['BTC','ETH','ETC','ATOM','POL','ADA','AVAX','DOT','BNB','SOL','XRP','LTC','DOGE'];
const driveFileId = '1QOqbo5CMv-1Danv-iJk8fsen_QnCXN6v';
const apiKey      = 'AIzaSyBFLHlDiNbiTEYtnoqx_-bj4D2ePGHeHnw';

// UI行為
document.getElementById('addMajorCoins').addEventListener('change', e => {
  if (e.target.checked) leftInput.value = majorCoins.join('\n');
});
document.getElementById('enableCustomPairing').addEventListener('change', e => {
  document.getElementById('customPairingOptions').style.display = e.target.checked ? 'block' : 'none';
});
// ... (以下是原有的 handleSymbolFormat、splitInput、getBinancePrices、sortPairsByPrice、generateFullPairs、generateUniquePairs、generateOneWayPairs、generateRSPairs、autoFetchRsBtn、downloadResult 函數，無變動，略過以節省空間)
</script>
<!--───────────── Telegram Web-App────────────-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    document.getElementById('uploadToTradingView').style.display = 'inline-block';
  }
});

async function uploadToDrive(content, fileName) {
  const boundary = '-------' + Date.now();
  const metadata = { name: fileName, parents: ['1QOqbo5CMv-1Danv-iJk8fsen_QnCXN6v'] };
  const form = `--${boundary}\nContent-Type: application/json\n\n${JSON.stringify(metadata)}\n--${boundary}\nContent-Type: text/plain\n\n${content}\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&key=' + apiKey, {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body: form
  });
  if (!res.ok) return; // 新增：基本檢查，避免崩潰
  const data = await res.json();
  const fileId = data.id;

  // 設定為公開
  const permRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions?key=${apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' })
  });
  if (!permRes.ok) return; // 新增：基本檢查

  return fileId;
}

async function uploadToTradingView() {
  if (!(window.Telegram && Telegram.WebApp)) {
    alert('請在 Telegram 內使用');
    return;
  }
  const symbols = resultArea.value.trim();
  if (!symbols) {
    alert('請先產生或貼上配對結果');
    return;
  }
  if (symbols.length > 3900) {
    alert('⚠️ 您的清單過大（超過4000字），Telegram官方無法直接匯入。請縮減清單或分批處理，或直接下載txt傳Bot。');
    return;
  }
  const d = new Date(); // 新增：確保 d 在這裡定義
  const listName = `Pairs_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}` +
                   `${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}` +
                   `${String(d.getMinutes()).padStart(2, '0')}`;
  const fileName = `Pairs_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}` +
                   `${String(d.getDate()).padStart(2, '0')}${String(d.getHours()).padStart(2, '0')}` +
                   `${String(d.getMinutes()).padStart(2, '0')}${String(d.getSeconds()).padStart(2, '0')}.txt`;
  const fileId = await uploadToDrive(symbols, fileName);
  if (fileId) { // 新增：檢查 fileId 是否成功取得
    Telegram.WebApp.sendData(JSON.stringify({ action: 'process_drive_file', fileId: fileId, listName: listName }));
    setTimeout(async () => {
      await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?key=${apiKey}`, { method: 'DELETE' });
    }, 10000);
  }
}
</script>
</body>
</html>
