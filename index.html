<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>交易對配對工具</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body{padding:20px}
    .result-area{font-family:monospace;font-size:14px;white-space:pre-wrap}
    .form-section{margin-bottom:20px;padding:15px;border:1px solid #dee2e6;border-radius:5px}
    .loading{display:none;color:#007bff}
    .custom-pairing-options{margin-top:15px;padding:10px;background:#f8f9fa;border-radius:5px}
    .option-description{font-size:12px;color:#6c757d;margin-left:20px}
  </style>
</head>
<body>
<div class="container">
  <h2 class="mb-4">交易對配對工具</h2>

  <!--───────── 標準配對 ─────────-->
  <div class="form-section">
    <h4>標準配對功能</h4>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="leftInput">配對標的組 (左)</label>
          <textarea class="form-control" id="leftInput" rows="5" placeholder="請輸入標的，用逗號或換行分隔"></textarea>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="rightInput">配對標的組 (右)</label>
          <textarea class="form-control" id="rightInput" rows="5" placeholder="請輸入標的，用逗號或換行分隔"></textarea>
        </div>
      </div>
    </div>

    <div class="row mb-3 align-items-center">
      <div class="col-auto">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="addMajorCoins" />
          <label class="form-check-label" for="addMajorCoins">加入大幣配對</label>
        </div>
      </div>
      <div class="col-auto">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="priceSort" checked />
          <label class="form-check-label" for="priceSort">配對依照市價高低組合</label>
        </div>
        <div class="loading" id="priceLoading" style="margin-left:25px">正在取得市價資料...</div>
      </div>
    </div>

    <div class="mb-3">
      <button type="button" class="btn btn-primary mr-2" onclick="generateFullPairs()">產生完整配對</button>
      <button type="button" class="btn btn-success mr-2" onclick="generateUniquePairs()">產生不重複配對</button>
      <button type="button" class="btn btn-info mr-2" onclick="generateOneWayPairs()">單向配對</button>
    </div>
  </div>

  <!--───────── RS + 自訂配對 ─────────-->
  <div class="form-section">
    <h4>RS 清單建立強弱組合</h4>
    <div class="row">
      <div class="col-md-2">
        <div class="form-group">
          <label for="strongCount">強勢組數</label>
          <input type="number" class="form-control" id="strongCount" value="10" min="0" />
        </div>
      </div>
      <div class="col-md-2">
        <div class="form-group">
          <label for="weakCount">弱勢組數</label>
          <input type="number" class="form-control" id="weakCount" value="10" min="0" />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label for="rsFile">上傳 RS 清單 (.txt)</label>
          <input type="file" class="form-control-file" id="rsFile" accept=".txt" />
        </div>
      </div>
      <div class="col-md-4 mt-4 pt-2">
        <button type="button" class="btn btn-secondary" id="autoFetchRsBtn">自動讀取最新 RS 清單</button>
        <span class="loading" id="autoFetchLoading">讀取中...</span>
      </div>
    </div>

    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="enableCustomPairing" />
      <label class="form-check-label" for="enableCustomPairing"><strong>加入自訂標的配對</strong></label>
    </div>

    <div class="custom-pairing-options" id="customPairingOptions" style="display:none">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="customAsStrong" />
        <label class="form-check-label" for="customAsStrong">選項A：自訂標的作為強勢組</label>
        <div class="option-description">自訂標的 vs RS弱勢組</div>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="customAsWeak" />
        <label class="form-check-label" for="customAsWeak">選項B：自訂標的作為弱勢組</label>
        <div class="option-description">RS強勢組 vs 自訂標的</div>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="customAsBoth" checked />
        <label class="form-check-label" for="customAsBoth">選項C：自訂標的同時作為強勢和弱勢 <span class="badge badge-primary">預設</span></label>
        <div class="option-description">自訂標的 vs RS弱勢組，且 RS強勢組 vs 自訂標的</div>
      </div>
      <small class="text-muted"><strong>說明：</strong>多選時會額外加入以上配對，並自動加區塊標籤</small>
    </div>

    <button type="button" class="btn btn-warning mt-2" onclick="generateRSPairs()">使用 RS 清單建立強弱組合</button>
  </div>

  <div class="mb-3">
    <button type="button" class="btn btn-secondary" onclick="downloadResult()">下載結果</button>
  </div>

  <div class="form-group">
    <label for="result">生成結果</label>
    <textarea class="form-control result-area" id="result" rows="15" readonly></textarea>
  </div>
</div>

<!───────────── JavaScript ─────────────>
<script>
let result='', latestRsContent='';
const majorCoins=['BTC','ETH','ETC','ATOM','POL','ADA','AVAX','DOT','BNB','SOL','XRP','LTC','DOGE'];
const driveFileId='1QOqbo5CMv-1Danv-iJk8fsen_QnCXN6v';
const apiKey='AIzaSyBFLHlDiNbiTEYtnoqx_-bj4D2ePGHeHnw';

document.getElementById('addMajorCoins').addEventListener('change',e=>{
  if(e.target.checked) document.getElementById('leftInput').value=majorCoins.join('\n');
});
document.getElementById('enableCustomPairing').addEventListener('change',e=>{
  document.getElementById('customPairingOptions').style.display=e.target.checked?'block':'none';
});

function handleSymbolFormat(s){
  s=s.trim().toUpperCase().replace('USDC.P','USDT.P');
  return /^BINANCE:/.test(s)?s:`BINANCE:${s}USDT.P`;
}
const splitInput=str=>str.split(/[\s,]+/).filter(x=>x.trim());

async function getBinancePrices(symbols){
  const apiSymbols=symbols.map(s=>s.replace('BINANCE:','').replace('.P',''));
  try{const r=await fetch('https://fapi.binance.com/fapi/v1/ticker/price');const d=await r.json();const p={};
    d.forEach(i=>{if(apiSymbols.includes(i.symbol))p[i.symbol]=+i.price});return p;}catch{return {};}
}
async function sortPairsByPrice(pairs){
  if(!document.getElementById('priceSort').checked)return pairs;
  document.getElementById('priceLoading').style.display='block';
  try{
    const set=new Set();pairs.forEach(p=>{if(p.includes('/')){const[l,r]=p.split('/');set.add(l);set.add(r)}});
    const price=await getBinancePrices([...set]);
    return pairs.map(p=>{
      if(!p.includes('/'))return p;
      const[l,r]=p.split('/'),lp=price[l.replace('BINANCE:','').replace('.P','')]||0,
            rp=price[r.replace('BINANCE:','').replace('.P','')]||0;
      return lp>=rp?`${l}/${r}`:`${r}/${l}`;
    });
  }finally{document.getElementById('priceLoading').style.display='none';}
}

/*───────── 標準配對函式─────────*/
async function generateFullPairs(){
  const left=splitInput(document.getElementById('leftInput').value),
        right=splitInput(document.getElementById('rightInput').value),
        all=[...new Set([...left,...right])];
  const pairs=[];
  for(let i=0;i<all.length;i++)for(let j=0;j<all.length;j++)if(i!==j)
    pairs.push(`${handleSymbolFormat(all[i])}/${handleSymbolFormat(all[j])}`);
  result=(await sortPairsByPrice(pairs)).join(',\n');document.getElementById('result').value=result;
}
async function generateUniquePairs(){
  const left=splitInput(document.getElementById('leftInput').value),
        right=splitInput(document.getElementById('rightInput').value),
        all=[...new Set([...left,...right])];
  const pairs=[];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)
    pairs.push(`${handleSymbolFormat(all[i])}/${handleSymbolFormat(all[j])}`);
  result=(await sortPairsByPrice(pairs)).join(',\n');document.getElementById('result').value=result;
}
async function generateOneWayPairs(){
  const left=splitInput(document.getElementById('leftInput').value),
        right=splitInput(document.getElementById('rightInput').value);
  const pairs=[];
  left.forEach(l=>right.forEach(r=>{
    const lf=handleSymbolFormat(l),rf=handleSymbolFormat(r);
    if(lf!==rf)pairs.push(`${lf}/${rf}`);
  }));
  result=(await sortPairsByPrice(pairs)).join(',\n');document.getElementById('result').value=result;
}

/*───────── RS 清單配對─────────*/
async function generateRSPairs(){
  let text='';
  const fileInput=document.getElementById('rsFile');
  if(fileInput.files.length>0){text=await fileInput.files[0].text();}
  else if(latestRsContent){text=latestRsContent;}
  else{alert('請先上傳 RS 清單或使用自動讀取！');return;}

  const strongCnt=parseInt(document.getElementById('strongCount').value)||0,
        weakCnt=parseInt(document.getElementById('weakCount').value)||0,
        lines=text.split('\n').map(l=>l.trim()).filter(l=>l && !l.includes('BINANCE:BTCDOMUSDT.P'));

  const rsOnly=!document.getElementById('enableCustomPairing').checked;
  if(rsOnly && (strongCnt===0||weakCnt===0)){alert('強弱組數不可為0');return;}

  const useStrong=strongCnt>0?strongCnt:(rsOnly?0:10),
        useWeak=weakCnt>0?weakCnt:(rsOnly?0:10);

  const strongSyms=lines.slice(0,useStrong).map(handleSymbolFormat),
        weakSyms  =lines.slice(-useWeak).map(handleSymbolFormat);

  const blocks={A:[],B:[],C:[]};

  if(useStrong&&useWeak)strongSyms.forEach(s=>weakSyms.forEach(w=>{if(s!==w)blocks.A.push(`${s}/${w}`)}));

  if(document.getElementById('enableCustomPairing').checked){
    const custom=[...new Set(splitInput(document.getElementById('leftInput').value).map(handleSymbolFormat))];
    if(document.getElementById('customAsStrong').checked)
      custom.forEach(c=>weakSyms.forEach(w=>{if(c!==w)blocks.B.push(`${c}/${w}`)}));
    if(document.getElementById('customAsWeak').checked)
      strongSyms.forEach(s=>custom.forEach(c=>{if(s!==c)blocks.C.push(`${s}/${c}`)}));
    if(document.getElementById('customAsBoth').checked){
      custom.forEach(c=>weakSyms.forEach(w=>{if(c!==w)blocks.B.push(`${c}/${w}`)}));
      strongSyms.forEach(s=>custom.forEach(c=>{if(s!==c)blocks.C.push(`${s}/${c}`)}));
    }
  }

  let out=[];
  if(blocks.A.length){out.push('###RS強勢對弱勢',...blocks.A);}
  if(blocks.B.length){out.push('###自訂對弱勢',...blocks.B);}
  if(blocks.C.length){out.push('###自訂對強勢',...blocks.C);}

  result=(await sortPairsByPrice(out)).join(',\n');document.getElementById('result').value=result;
}

/*───────── Drive 自動讀取─────────*/
document.getElementById('autoFetchRsBtn').addEventListener('click',async()=>{
  const load=document.getElementById('autoFetchLoading');load.style.display='inline';
  try{
    const url=`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media&key=${apiKey}`;
    const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);
    latestRsContent=await res.text();
    document.getElementById('result').value=latestRsContent;
    alert('✅ 讀取成功！');
  }catch(e){alert('❌ 讀取失敗: '+e.message);}
  finally{load.style.display='none';}
});

/*───────── 下載─────────*/
function downloadResult(){
  if(!result){alert('請先產生配對再下載！');return;}
  const d=new Date(),ts=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2);
  const blob=new Blob([result],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`LS_Pairs_${ts}.txt`;document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);
}
</script>
</body>
</html>
